<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM LOCKED</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="gameScreen">

        <div class="top-warning">
            ⚠ SYSTEM LOCKED ⚠
        </div>

        <div class="container">

            <div class="lock-icon">🔒</div>

            <h1>SYSTEM LOCKED</h1>

            <p class="subtitle">
                HỆ THỐNG ĐANG BỊ KHÓA
            </p>

            <div class="divider"></div>

            <p class="instruction">
                MUỐN THOÁT? HÃY GIẢI ĐÚNG BÀI TOÁN
            </p>

            <div id="problem">
                Đang tạo bài toán...
            </div>

            <input
                id="answer"
                type="number"
                placeholder="Nhập kết quả..."
                autocomplete="off"
            >

            <button id="submitBtn">
                XÁC NHẬN
            </button>

            <div id="message"></div>

            <div class="attempt">
                Số lần thử: <span id="attemptCount">0</span>
            </div>

        </div>

        <div class="music-status">
            🔊 MUSIC: <span>ON</span>
        </div>

    </div>


    <div id="successScreen" class="hidden">

        <div class="success-box">

            <div class="success-icon">✅</div>

            <h1>CHÍNH XÁC!</h1>

            <p>Bạn đã giải đúng 😂</p>

            <p class="success-small">
                Hệ thống đã được mở khóa.
            </p>

            <button id="exitBtn">
                🚪 THOÁT
            </button>

        </div>

    </div>


    <audio id="music" autoplay loop>
        <source src="troll.mp3" type="audio/mpeg">
    </audio>


    <script src="script.js"></script>

</body>
</html>
